    :root { --bg: #ffffff; --fg: #111111; --muted: #767676; --faint: #e5e5e5; }

    * { box-sizing: border-box; }
    body {

      line-height: 1.7;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      border-left: 2px solid var(--faint);
      padding-left: 10px;

    .state div span {
      color: var(--fg);
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      color: var(--fg);
      background: transparent;
      border: 1px solid var(--faint);
      border-radius: 3px;
      outline: none;
      font-family: inherit;
    }
    input:focus { border-color: var(--muted); }
    #err { font-size: 12px; color: #c0392b; min-height: 16px; display: none; }

    const STORAGE_KEY = "blog_tier1_pwd_v1";
    const TTL_MS = 24 * 60 * 60 * 1000;

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    function loadCachedPwd() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (!obj || !obj.pwd || !obj.ts || (Date.now() - obj.ts > TTL_MS)) {
          localStorage.removeItem(STORAGE_KEY);
          return null;
        }
        return obj.pwd;
      } catch (_) {
        return null;
      }
    }

    function saveCachedPwd(pwd) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ pwd, ts: Date.now() }));
      } catch (_) {}
    }

    async function tryUnlock(pwd, fromCache) {
      try {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(pwd), "PBKDF2", false, ["deriveKey"]);
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64ToBytes(SALT), iterations: 100000, hash: "SHA-256" },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64ToBytes(IV) },
          key,
          b64ToBytes(CIPHERTEXT)
        );
        saveCachedPwd(pwd);
        const html = new TextDecoder().decode(decrypted);
        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        if (fromCache) {
          localStorage.removeItem(STORAGE_KEY);
        } else {
          const err = document.getElementById("err");
          if (err) err.style.display = "block";
        }
      }
    }

    const cached = loadCachedPwd();
    if (cached) tryUnlock(cached, true);

    document.getElementById("unlock-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const val = document.getElementById("pwd").value;
      if (val) tryUnlock(val, false);
    });
  </script>
